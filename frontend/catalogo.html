<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pearl Glean - Joyería fina hecha a mano en Honduras"
    />
    <meta name="theme-color" content="#141210" />
    <title>Pearl Glean - Joyería Fina</title>
    <script>
      // Detectar base path para SPA
      (function () {
        var p = location.pathname;
        var base;
        if (p.indexOf("/frontend/") !== -1) {
          // Live Server desde raíz del proyecto: /frontend/
          base = p.substring(0, p.indexOf("/frontend/")) + "/frontend/";
        } else if (p.endsWith(".html")) {
          base = p.substring(0, p.lastIndexOf("/") + 1);
        } else {
          base = "/";
        }
        window.__SPA_BASE = base;
        var b = document.createElement("base");
        b.href = base;
        document.head.appendChild(b);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      // Aplicar tema guardado antes de renderizar (evita flash)
      (function () {
        if (localStorage.getItem('pearl-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div class="container">
      <!-- NAVEGACIÓN -->
      <nav class="navbar">
        <div class="navbar-left">
          <a href="/catalogo" data-link class="logo">
            <span class="logo-pearl">PEARL</span>
            <span class="logo-glean">GLEAN</span>
          </a>
        </div>
        <div class="navbar-right">
          <a href="/productos" class="nav-link" data-link>PRODUCTOS</a>
          <a href="/ofertas" class="nav-link" data-link>OFERTAS</a>
          <button class="cart-btn" id="cart-btn" title="Carrito" aria-label="Ver carrito">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
            <span class="cart-badge" id="cart-badge" style="display:none">0</span>
          </button>
          <button class="theme-toggle" id="theme-toggle" title="Cambiar tema" aria-label="Cambiar tema">
            <!-- Luna (tema oscuro activo) -->
            <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <!-- Sol (tema claro activo) -->
            <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </button>
        </div>
      </nav>

      <!-- CONTENIDO DINÁMICO (el router renderiza aquí) -->
      <main id="app-view"></main>

      <!-- FOOTER -->
      <footer id="contacto" class="footer">
        <div class="footer-content">
          <div class="footer-brand">
            <div class="footer-logo">
              <span class="logo-pearl">PEARL</span>
              <span class="logo-glean">GLEAN</span>
            </div>
            <p>
              Joyería fina hecha a mano en Honduras. Precios en lempiras,
              entregas coordinadas por WhatsApp.
            </p>
          </div>
          <div class="footer-social">
            <div class="social-label">SÍGUENOS</div>
            <a href="https://instagram.com" target="_blank" class="social-link">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
              >
                <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                <circle cx="12" cy="12" r="4"></circle>
                <circle cx="17.5" cy="6.5" r="1"></circle>
              </svg>
              Instagram
            </a>
            <a href="https://facebook.com" target="_blank" class="social-link">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
              >
                <path
                  d="M14 9h3V6h-3c-2 0-3.5 1.5-3.5 3.5V12H8v3h2.5v6h3v-6H16l.5-3h-3V9.6c0-.4.4-.6.5-.6z"
                ></path>
              </svg>
              Facebook
            </a>
            <a
              href="https://wa.me/50496310509"
              target="_blank"
              class="social-link"
            >
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
              >
                <path
                  d="M21 11.5a8.5 8.5 0 0 1-12.4 7.5L3 20l1.1-5.4A8.5 8.5 0 1 1 21 11.5z"
                ></path>
              </svg>
              WhatsApp
            </a>
          </div>
        </div>
      </footer>
    </div>

    <!-- OVERLAY CARRITO -->
    <div class="cart-overlay" id="cart-overlay"></div>

    <!-- PANEL CARRITO -->
    <div class="cart-panel" id="cart-panel">
      <div class="cart-panel-header">
        <h3 class="cart-panel-title">Mi carrito</h3>
        <button class="cart-close" id="cart-close" aria-label="Cerrar carrito">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-footer" id="cart-footer" style="display:none">
        <div class="cart-total-row">
          <span>Total</span>
          <strong id="cart-total">L 0.00</strong>
        </div>
        <a id="cart-whatsapp" href="#" target="_blank" class="btn btn-primary cart-whatsapp-btn">PEDIR POR WHATSAPP</a>
        <button class="cart-clear-btn" id="cart-clear">Vaciar carrito</button>
      </div>
    </div>

    <script src="./router.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
