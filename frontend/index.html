<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pearl Glean - Joyería fina hecha a mano en Honduras"
    />
    <meta name="theme-color" content="#141210" />
    <title>Pearl Glean - Joyería Fina</title>
    <script>
      // Detectar base path para SPA
      (function () {
        var p = location.pathname;
        var base;
        if (p.endsWith('.html')) {
          base = p.substring(0, p.lastIndexOf('/') + 1);
        } else if (p.indexOf('/pearl-glean/') !== -1) {
          base = p.substring(0, p.indexOf('/pearl-glean/')) + '/pearl-glean/';
        } else {
          base = '/';
        }
        window.__SPA_BASE = base;
        var b = document.createElement('base');
        b.href = base;
        document.head.appendChild(b);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- NAVEGACIÓN -->
      <nav class="navbar">
        <div class="navbar-left">
          <a href="/" data-link class="logo">
            <span class="logo-pearl">PEARL</span>
            <span class="logo-glean">GLEAN</span>
          </a>
        </div>
        <div class="navbar-right">
          <a href="/productos" class="nav-link" data-link>PRODUCTOS</a>
          <a href="/ofertas" class="nav-link" data-link>OFERTAS</a>
        </div>
      </nav>

      <!-- CONTENIDO DINÁMICO (el router renderiza aquí) -->
      <main id="app-view"></main>

      <!-- FOOTER -->
      <footer id="contacto" class="footer">
        <div class="footer-content">
          <div class="footer-brand">
            <div class="footer-logo">
              <span class="logo-pearl">PEARL</span>
              <span class="logo-glean">GLEAN</span>
            </div>
            <p>
              Joyería fina hecha a mano en Honduras. Precios en lempiras,
              entregas coordinadas por WhatsApp.
            </p>
          </div>
          <div class="footer-social">
            <div class="social-label">SÍGUENOS</div>
            <a href="https://instagram.com" target="_blank" class="social-link">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
              >
                <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                <circle cx="12" cy="12" r="4"></circle>
                <circle cx="17.5" cy="6.5" r="1"></circle>
              </svg>
              Instagram
            </a>
            <a href="https://facebook.com" target="_blank" class="social-link">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
              >
                <path
                  d="M14 9h3V6h-3c-2 0-3.5 1.5-3.5 3.5V12H8v3h2.5v6h3v-6H16l.5-3h-3V9.6c0-.4.4-.6.5-.6z"
                ></path>
              </svg>
              Facebook
            </a>
            <a
              href="https://wa.me/50496310509"
              target="_blank"
              class="social-link"
            >
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
              >
                <path
                  d="M21 11.5a8.5 8.5 0 0 1-12.4 7.5L3 20l1.1-5.4A8.5 8.5 0 1 1 21 11.5z"

              </svg>
              WhatsApp

          </div>
        </div>
      </footer>
    </div>

    <script src="./router.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
