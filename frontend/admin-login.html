<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pearl Glean — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-container">
        <!-- Panel izquierdo decorativo -->
        <div class="login-left-panel">
          <div class="login-shape login-shape-1"></div>
          <div class="login-shape login-shape-2"></div>
          <div class="login-shape login-shape-3"></div>
        </div>

        <!-- Panel derecho con formulario -->
        <div class="login-right-panel">
          <!-- Espacio para logo de la marca -->
          <div class="login-logo-area">
            <!-- Aquí puedes colocar la imagen del logo -->
          </div>

          <h2 class="login-heading">Pearl Glean <span class="login-heading-badge">Admin</span></h2>
          <p class="login-subtitle">Inicia sesión para gestionar el catálogo.</p>

          <div id="login-error" class="login-error"></div>

          <form id="login-form" autocomplete="off">
            <div class="form-group">
              <div class="login-input-wrapper">
                <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M20 21a8 8 0 10-16 0"/>
                </svg>
                <input
                  class="form-input login-field"
                  type="text"
                  id="username"
                  name="username"
                  placeholder="Usuario"
                  required
                  autofocus
                />
              </div>
            </div>
            <div class="form-group">
              <div class="login-input-wrapper">
                <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0110 0v4"/>
                </svg>
                <input
                  class="form-input login-field"
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Contraseña"
                  required
                />
                <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar contraseña">
                  <svg class="eye-icon" id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-icon" id="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="display:none">
                    <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
            </div>
            <button class="btn btn-login" type="submit" id="login-btn">
              LOGIN
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="./admin-login.js"></script>
  </body>
</html>
